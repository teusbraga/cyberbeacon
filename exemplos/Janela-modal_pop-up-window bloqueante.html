<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal</title>
  <link rel="stylesheet" href="style.css">
  <style>
	* {
	  margin: 0;
	  padding: 0;
	  box-sizing: border-box;
	  font-family: Arial, Helvetica, sans-serif;
	}

	body {
	  width: 100vw;
	  height: 100vh;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  background-color: #0a0c21;
	}

	.btnOpenModal {
	  font-size: x-large;
	  padding: 10px;
	  border: none;
	  border-radius: 5px;
	  background-color: blueviolet;
	  color: white;
	  cursor: pointer;
	}

	hr {
	  border: 0px;
	  border-top: 1px solid lightgray;
	}

	.modal-container {
	  width: 100vw;
	  position: fixed;
	  top: 30px;
	  display: none;
	  z-index: 999;
	  justify-content: center;
	}

	.modal {
	  display: flex;
	  flex-direction: column;
	  padding: 30px;
	  background-color: white;
	  border-radius: 10px;
	  width: 50%;
	}

	.active {
	  display: flex;
	}

	.active .modal {
	  animation: modal .4s;
	}

	@keyframes modal {
	  from {
		opacity: 0;
		transform: translate3d(0, -60px, 0);
	  }
	  to {
		opacity: 1;
		transform: translate3d(0, 0, 0);
	  }
	}

	span {
	  margin: 10px auto;
	}

	.btns {
	  display: flex;
	  justify-content: space-between;
	  margin-top: 10px;
	}

	.btns button {
	  font-size: medium;
	  padding: 10px;
	  border: none;
	  border-radius: 5px;
	  color: white;
	  cursor: pointer;
	}

	.btnOK {
	 background-color: blue!important;
	}

	.btnClose {
	  background-color: brown!important;
	 }

	 @media (max-width: 500px) {
	  .modal {
		padding: 10px;
		width: 80%;
	  }   

	  span, .btns button {
		font-size: smaller;
	  }
 
 }
 
 
 
 .modal-container {
    position: fixed; /* Fica fixo na tela */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5); /* Fundo escuro transparente */
    display: flex; /* Centraliza o modal */
    justify-content: center;
    align-items: center;
    z-index: 9999; /* Fica acima de tudo */
    visibility: hidden; /* Escondido por padrão */
    opacity: 0; /* Transparente por padrão */
    transition: opacity 0.3s ease; /* Efeito de fade-in/out */
}

.modal-container.active {
    visibility: visible; /* Mostra o modal */
    opacity: 1; /* Torna visível */
}

.modal {
    background: white;
    padding: 20px;
    border-radius: 8px;
    z-index: 10000; /* Fica acima do fundo */
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

  </style>
</head>
<body>
  <button class="btnOpenModal" onclick="openModal1()">Open Modal</button>

  <div class="modal-container">
    <div class="modal">
      <h2>Info</h2>
      <hr />
      <span>
        Lorem Ipsum is simply dummy text of the printing and typesetting 
        industry. Lorem Ipsum has been the industry's standard dummy text
         ever since the 1500s, when an unknown printer took a galley of 
         type and scrambled it to make a type specimen book. 
      </span>
      <hr />
      <div class="btns">
        <button class="btnOK" onclick="closeModal1()">OK</button>
        <button class="btnClose" onclick="closeModal1()">Close</button>
      </div>
    </div>
  </div>
  
  <div class="modal-container">
    <div class="modal">
        <h2>Info</h2>
        <p>Lorem Ipsum é texto de exemplo...</p>
        <button onclick="closeModal()">Fechar</button>
    </div>
</div>

<button onclick="openModal()">Abrir Modal</button>
  
  <script >
	const modal1 = document.querySelector('.modal-container');

	function openModal1() {
	  modal1.classList.add('active');
	}

	function closeModal1() {
	  modal1.classList.remove('active');
	}
	const modal = document.querySelector('.modal-container');

function openModal() {
    modal.classList.add('active'); // Mostra o modal
    document.body.style.overflow = 'hidden'; // Bloqueia o scroll da página
}

function closeModal() {
    modal.classList.remove('active'); // Esconde o modal
    document.body.style.overflow = ''; // Libera o scroll da página
}

  </script>
  <!-- Código copiado e editado (chatGPT) de WilliamDosSantos no GitHub dele --!>
</body>
</html>
