<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Dados com LocalStorage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid black;
    }
    th, td {
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f4f4f4;
    }
    input {
      margin: 5px;
    }
  </style>
</head>
<body>
  <h1>Gerenciar Dados com LocalStorage</h1>

  <label for="textInput">Texto:</label>
  <input type="text" id="textInput" placeholder="Digite um texto" required>
  <br>
  <label for="vectorInput1">Número 1 (0 ou 1):</label>
  <input type="number" id="vectorInput1" min="0" max="1" required>
  <label for="vectorInput2">Número 2 (0 ou 1):</label>
  <input type="number" id="vectorInput2" min="0" max="1" required>
  <br>
  <button onclick="saveEntry()">Salvar Entrada</button>
  <button onclick="exportToJson()">Exportar para JSON</button>
  <br><br>
  
  <!-- Botão e input para carregar o arquivo JSON -->
  <input type="file" id="jsonUpload" accept=".json">
  <button onclick="uploadJson()">Carregar Dados JSON</button>

  <table id="dataTable">
    <thead>
      <tr>
        <th>Texto</th>
        <th>Vetor</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <script>
    // Classe construtora para representar uma entrada
    class Entrada {
      constructor(texto, vetor) {
        this.texto = texto;
        this.vetor = vetor;
      }
    }

    // Função para salvar entrada no LocalStorage
    function saveEntry() {
      const textInput = document.getElementById('textInput').value.trim();
      const vectorInput1 = parseInt(document.getElementById('vectorInput1').value);
      const vectorInput2 = parseInt(document.getElementById('vectorInput2').value);

      // Validação simples dos campos
      if (!textInput || isNaN(vectorInput1) || isNaN(vectorInput2)) {
        alert('Preencha todos os campos corretamente!');
        return;
      }

      // Criando um objeto Entrada
      const entrada = new Entrada(textInput, [vectorInput1, vectorInput2]);

      // Salvando no LocalStorage
      // A chave será o texto fornecido pelo usuário, garantindo que seja única
      localStorage.setItem(textInput, JSON.stringify(entrada));
      alert('Entrada salva com sucesso!');

      // Atualizando a tabela
      updateTable();
    }

    // Função para atualizar a tabela exibindo os dados do LocalStorage
    function updateTable() {
      const tableBody = document.getElementById('dataTable').querySelector('tbody');
      tableBody.innerHTML = ''; // Limpa a tabela

      // Percorre todas as chaves no LocalStorage
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i); // Obtém a chave
        const entry = localStorage.getItem(key);

        try {
          const parsedEntry = JSON.parse(entry); // Tenta parsear o JSON
          if (parsedEntry && parsedEntry.texto && Array.isArray(parsedEntry.vetor)) {
            // Adiciona uma linha na tabela apenas para entradas válidas
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${parsedEntry.texto}</td>
              <td>[${parsedEntry.vetor.join(', ')}]</td>
            `;
            tableBody.appendChild(row);
          }
        } catch (error) {
          console.error(`Erro ao processar entrada ${key}:`, error);
        }
      }
    }

    // Função para exportar os dados do LocalStorage para um arquivo JSON
    function exportToJson() {
      const data = {};

      // Coleta todos os dados do LocalStorage
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i); // Obtém a chave
        const entry = localStorage.getItem(key);

        try {
          data[key] = JSON.parse(entry); // Tenta adicionar ao objeto final
        } catch (error) {
          console.error(`Erro ao exportar entrada ${key}:`, error);
        }
      }

      // Cria um blob de arquivo JSON
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      // Cria um link de download e aciona o download
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dados.json';
      a.click();

      // Libera a URL após o download
      URL.revokeObjectURL(url);
    }

    // Função para carregar o arquivo JSON e atualizar os dados do LocalStorage
    function uploadJson() {
      const fileInput = document.getElementById('jsonUpload');
      const file = fileInput.files[0];

      // Verifica se um arquivo foi selecionado
      if (!file) {
        alert('Por favor, selecione um arquivo JSON!');
        return;
      }

      const reader = new FileReader();

      reader.onload = function(event) {
        try {
          // Apaga os dados antigos do LocalStorage
          localStorage.clear();

          // Carrega os dados do arquivo JSON
          const uploadedData = JSON.parse(event.target.result);

          // Salva os dados no LocalStorage
          for (const key in uploadedData) {
            localStorage.setItem(key, JSON.stringify(uploadedData[key]));
          }

          alert('Dados carregados com sucesso!');
          updateTable(); // Atualiza a tabela após carregar os dados
        } catch (e) {
          alert('Erro ao carregar o arquivo JSON!');
          console.error(e);
        }
      };

      // Lê o conteúdo do arquivo JSON
      reader.readAsText(file);
    }

    // Atualiza a tabela ao carregar a página
    window.onload = updateTable;
  </script>
</body>
</html>
