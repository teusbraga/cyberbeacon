<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Sinal Fora de Alcance | Cyber Beacon</title>
  <link rel="icon" type="image/svg+xml" href="imgs/favicon-beacon-linear.svg?v=2026">
  <link rel="alternate icon" href="favicon.svg?v=2026">
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --border: #283548;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --brand: #6366f1;
      --brand-accent: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .error-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.15);
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      display: block;
      filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.6));
    }

    .error-code {
      font-size: 4rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #06b6d4, #6366f1, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
      letter-spacing: -2px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
        justify-content: center;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #6366f1);
      color: white;
      border: none;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--brand-accent);
      color: var(--brand-accent);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <img src="imgs/favicon-beacon-linear.svg?v=2026" alt="Cyber Beacon" class="logo-badge">
    <div class="error-code">404</div>
    <h1>Sinal Fora de Alcance</h1>
    <p>O farol não detectou a rota solicitada. A página pode ter sido movida, renomeada ou nunca existiu no sistema.</p>
    <div class="actions">
      <a href="index.html" class="btn btn-primary">🏠 Guia Completo</a>
      <a href="tutoriais.html" class="btn btn-secondary">⚡ Vitrine Bate-Olho</a>
    </div>
  </div>
</body>
</html>
