<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="neonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Gradiente da marca (Indigo para Cyan) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="neonBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base com borda em gradiente da marca -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#neonBg)" stroke="url(#brandGrad)" stroke-width="2"/>

  <!-- Feixe de luz volumétrico neon -->
  <polygon points="23,20 60,10 60,38 23,26" fill="url(#neonBeam)"/>

  <!-- Linhas de contorno do feixe -->
  <line x1="23" y1="20" x2="60" y2="10" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="23" y1="26" x2="60" y2="38" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Prompt de Terminal >_ em Neon Branco/Ciano (30% menor e alinhado à direita) -->
  <g filter="url(#neonGlow)">
    <path d="M 43,19 L 48.5,23.5 L 43,28" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="51.5" y1="28" x2="57.5" y2="28" stroke="#22d3ee" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- Farol estilizado em gradiente escuro e ciano -->
  <!-- Base -->
  <polygon points="5,50 31,50 33,55 3,55" fill="#1e293b"/>
  <!-- Porta em corte de luz -->
  <path d="M 15,55 L 15,49 A 3,3 0 0 1 21,49 L 21,55 Z" fill="#6366f1"/>

  <!-- Corpo -->
  <polygon points="9,28 27,28 30,50 6,50" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <!-- Faixas Neon -->
  <polygon points="6.8,44 29.2,36 29.6,38 7.2,46" fill="#f59e0b" filter="url(#neonGlow)"/>
  <polygon points="7.8,36 28.2,29 28.6,30.5 8.2,37.5" fill="#06b6d4" filter="url(#neonGlow)"/>

  <!-- Plataforma da Torre -->
  <polygon points="7,26 29,26 28,28 8,28" fill="#6366f1"/>

  <!-- Câmara da Lanterna -->
  <rect x="10" y="17" width="16" height="9" rx="1.5" fill="#030712" stroke="#22d3ee" stroke-width="1.2"/>
  <circle cx="18" cy="21.5" r="3.5" fill="#22d3ee" filter="url(#neonGlow)"/>
  <circle cx="18" cy="21.5" r="1.5" fill="#ffffff"/>

  <!-- Cúpula de Topo -->
  <polygon points="18,7 28,17 8,17" fill="#1e293b" stroke="#6366f1" stroke-width="0.8"/>
  <circle cx="18" cy="6" r="1.8" fill="#22d3ee" filter="url(#neonGlow)"/>
</svg>
