<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="boldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="boldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle de alto contraste -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="url(#boldBg)" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Feixe de luz limpo e amplo -->
  <polygon points="12,10 30,5 30,22 12,13" fill="url(#boldBeam)"/>

  <!-- Terminal >_ com traço grosso perfeitamente alinhado a pixels -->
  <path d="M 18,9.5 L 22.5,13.5 L 18,17.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24.5" y1="17.5" x2="28.5" y2="17.5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Farol Geométrico Robusto -->
  <!-- Base -->
  <rect x="2" y="24" width="14" height="3" rx="0.5" fill="#475569"/>
  <!-- Porta -->
  <path d="M 7,27 L 7,24 A 2,2 0 0 1 11,24 L 11,27 Z" fill="#0f172a"/>

  <!-- Corpo -->
  <polygon points="4.5,14 13.5,14 14.5,24 3.5,24" fill="#94a3b8"/>
  <!-- Faixa de corte Neon Ciano e Âmbar -->
  <polygon points="3.8,21 14.2,17.5 14.4,19 4,22.5" fill="#f59e0b"/>

  <!-- Lanterna (Foco de Luz) -->
  <rect x="5.5" y="9.5" width="7" height="4.5" fill="#0f172a"/>
  <circle cx="9" cy="11.5" r="2.2" fill="#00f5ff"/>

  <!-- Telhado Cúpula -->
  <polygon points="9,4 14,9.5 4,9.5" fill="#cbd5e1"/>
  <circle cx="9" cy="3.5" r="1" fill="#00f5ff"/>
</svg>
