<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente do feixe de luz elétrico -->
    <linearGradient id="beamFlatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Gradiente da torre (com contraste para abas claras e escuras) -->
    <linearGradient id="towerFlatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Feixe de luz sólido e nítido -->
  <polygon points="23,19 62,8 62,42 23,27" fill="url(#beamFlatGrad)" />

  <!-- Terminal Prompt >_ em branco puro para contraste máximo -->
  <!-- Chevron > -->
  <path d="M 33,18 L 42,25 L 33,32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor _ -->
  <line x1="47" y1="32" x2="57" y2="32" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Farol Vetorial -->
  <!-- Base com contorno -->
  <polygon points="4,52 32,52 34,58 2,58" fill="#1e293b" stroke="#00f0ff" stroke-width="0.75"/>
  <path d="M 15,58 L 15,51 A 3,3 0 0 1 21,51 L 21,58 Z" fill="#0284c7"/>

  <!-- Corpo da Torre -->
  <polygon points="9,28 27,28 30,52 6,52" fill="url(#towerFlatGrad)" stroke="#38bdf8" stroke-width="0.5"/>

  <!-- Faixas tecnológicas Cyber em Neon Âmbar e Ciano -->
  <polygon points="6.8,45 29.2,37 29.6,39.5 7.2,47.5" fill="#f59e0b"/>
  <polygon points="7.8,38 28.2,30 28.6,32 8.2,40" fill="#00f0ff"/>

  <!-- Plataforma -->
  <polygon points="7,25 29,25 28,28 8,28" fill="#94a3b8"/>

  <!-- Lâmpada e Câmara -->
  <rect x="10" y="16" width="16" height="9" rx="1" fill="#0f172a" stroke="#00f0ff" stroke-width="1.2"/>
  <circle cx="18" cy="20.5" r="4" fill="#00f0ff"/>
  <circle cx="18" cy="20.5" r="1.8" fill="#ffffff"/>

  <!-- Cúpula cônica -->
  <polygon points="18,6 28,16 8,16" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.5"/>
  <circle cx="18" cy="5" r="2" fill="#00f0ff"/>
</svg>
